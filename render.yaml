# Render Blueprint - Deploy all services at once
# Visit: https://dashboard.render.com/blueprints and connect this repo

services:
  # FastAPI Backend
  - type: web
    name: finance-companion-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: finance-companion-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0

  # React Frontend (Static Site)
  - type: web
    name: finance-companion-web
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: finance-companion-db
    plan: free
    databaseName: finance_companion
    user: finance_user
